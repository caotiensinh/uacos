name: WS3 real-provider readiness evidence

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ws3-real-provider-readiness.yml"
      - "scripts/provider_readiness.py"

permissions:
  contents: read

concurrency:
  group: ws3-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    env:
      UACOS_CODEX_ARGV_JSON: ${{ secrets.UACOS_CODEX_ARGV_JSON }}
      UACOS_CLAUDE_CODE_ARGV_JSON: ${{ secrets.UACOS_CLAUDE_CODE_ARGV_JSON }}
      UACOS_GOOSE_ARGV_JSON: ${{ secrets.UACOS_GOOSE_ARGV_JSON }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install UACOS
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]
      - name: Bootstrap Codex CLI
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          prefix="$RUNNER_TEMP/uacos-codex"
          npm install --prefix "$prefix" @openai/codex@latest
          bin="$prefix/node_modules/.bin"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/codex" --version
          "$bin/codex" exec --help
      - name: Probe provider CLI and cached auth
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_home=$HOME"
          for exe in codex claude goose; do
            if path="$(command -v "$exe" 2>/dev/null)"; then
              echo "$exe.path=$path"
            else
              echo "$exe.path=missing"
            fi
          done
          echo "common-path scan:"
          find "$HOME" /opt /usr/local/bin /usr/bin -maxdepth 5 \( -type f -o -type l \) \( -name codex -o -name claude -o -name goose \) -print 2>/dev/null | head -100 || true
          for entry in \
            "$HOME/.codex/auth.json" \
            "$HOME/.codex" \
            "$HOME/.claude" \
            "$HOME/.config/claude" \
            "$HOME/.config/goose"; do
            if [[ -e "$entry" ]]; then
              echo "cached_auth_present:$entry"
            else
              echo "cached_auth_missing:$entry"
            fi
          done
      - name: Provider readiness evidence
        run: python scripts/provider_readiness.py --output reports/provider_readiness.json --require-ready
      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws3-provider-readiness-${{ github.run_id }}
          path: reports/provider_readiness.json
          if-no-files-found: error
          retention-days: 30
