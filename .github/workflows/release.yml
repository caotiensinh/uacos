name: Release

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          pyproject = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          init_file = pathlib.Path("uacos/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^version\s*=\s*"([^"]+)"$', pyproject, re.MULTILINE)
          if not match:
              raise SystemExit("project version not found")
          version = match.group(1)
          if f'__version__ = "{version}"' not in init_file:
              raise SystemExit("pyproject.toml and uacos/__init__.py versions differ")
          prerelease = "true" if re.search(r"(?:a|b|rc)\d+$", version) else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"tag=v{version}\n")
              output.write(f"prerelease={prerelease}\n")
          PY

      - name: Create release for validated version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; no action required."
            exit 0
          fi

          args=(release create "$TAG" --target "$RELEASE_SHA" --title "UACOS $VERSION" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
